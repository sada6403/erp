# Included only in the existing HTTPS updates.nfplantation.com server block.
# Static installers, latest.yml, logo and the homepage keep their existing routes.
location = /director {
    proxy_pass http://127.0.0.1:4001;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header X-Robots-Tag "noindex, nofollow" always;
}
location ^~ /director/ {
    proxy_pass http://127.0.0.1:4001;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header X-Robots-Tag "noindex, nofollow" always;
}
location ^~ /api/management/ {
    proxy_pass http://127.0.0.1:4001;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    add_header Cache-Control "no-store" always;
}
location ^~ /_next/ {
    proxy_pass http://127.0.0.1:4001;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}
location = /robots.txt {
    root /var/www/updates;
    access_log off;
    log_not_found off;
    add_header Content-Type "text/plain; charset=utf-8" always;
    add_header Cache-Control "public, max-age=86400" always;
    add_header X-Robots-Tag "all, index, follow" always;
}
location = /sitemap.xml {
    root /var/www/updates;
    access_log off;
    log_not_found off;
    add_header Content-Type "application/xml; charset=utf-8" always;
    add_header Cache-Control "public, max-age=86400" always;
    add_header X-Robots-Tag "all, index, follow" always;
}
location = / {
    root /var/www/updates;
    try_files /index.html =404;
    add_header X-Robots-Tag "all, index, follow" always;
    add_header Cache-Control "public, max-age=300, must-revalidate" always;
}
location = /latest.yml {
    root /var/www/updates;
    add_header Cache-Control "no-store, must-revalidate" always;
    add_header Access-Control-Allow-Origin "*" always;
}
