name: Deploy VPS

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'portals/superadmin/**'
      - 'deploy/**'
      - 'scripts/deploy-vps.sh'
      - 'scripts/enable-director-vps.cjs'
      - 'scripts/publish-vps-release.sh'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-vps-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Deploy backend and superadmin on VPS
        run: sudo /usr/local/bin/pos-deploy
